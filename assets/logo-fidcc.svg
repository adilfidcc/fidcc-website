<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Logo FIDCC</title>
  <desc id="desc">Logo premium marocain pour FIDCC, inspiré du zellige, de l'étoile marocaine et de la balance.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F1D27A"/>
      <stop offset="0.45" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8E6A16"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#00864C"/>
      <stop offset="1" stop-color="#006233"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1F2937" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <g transform="translate(52 40)">
      <path d="M110 0 L140 54 L198 22 L166 80 L220 110 L166 140 L198 198 L140 166 L110 220 L80 166 L22 198 L54 140 L0 110 L54 80 L22 22 L80 54 Z" fill="#F8F5EF" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round"/>
      <path d="M110 22 L133 64 L178 42 L156 87 L198 110 L156 133 L178 178 L133 156 L110 198 L87 156 L42 178 L64 133 L22 110 L64 87 L42 42 L87 64 Z" fill="none" stroke="#006233" stroke-width="7" stroke-linejoin="round"/>
      <path d="M110 48 L128 80 L164 64 L148 98 L180 110 L148 122 L164 156 L128 140 L110 172 L92 140 L56 156 L72 122 L40 110 L72 98 L56 64 L92 80 Z" fill="none" stroke="#C1272D" stroke-width="5" stroke-linejoin="round" opacity=".92"/>
      <circle cx="110" cy="110" r="48" fill="#F8F5EF" stroke="url(#gold)" stroke-width="4"/>
      <text x="110" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#006233" letter-spacing="-5">FC</text>
      <g stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M110 78 V118"/>
        <path d="M76 94 H144"/>
        <path d="M86 96 L72 128 L100 128 Z"/>
        <path d="M134 96 L120 128 L148 128 Z"/>
        <path d="M96 144 H124"/>
      </g>
      <polygon points="110,6 116,18 130,18 119,26 123,40 110,31 97,40 101,26 90,18 104,18" fill="#006233"/>
    </g>
  </g>

  <g transform="translate(320 82)">
    <text x="0" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="#1F2937" letter-spacing="8">FIDCC</text>
    <line x1="4" y1="95" x2="440" y2="95" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="222" cy="95" r="7" fill="#C1272D"/>
    <text x="8" y="138" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="600" fill="#1F2937" letter-spacing="6">COMPTABILITÉ • PAIE</text>
    <text x="9" y="176" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="600" fill="#1F2937" letter-spacing="6">FISCALITÉ • CONSEIL</text>
  </g>
</svg>
